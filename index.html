                                    <div className="absolute -bottom-8 left-0 right-0 flex justify-center gap-2">
                                        {STACK_CARDS.map((_, idx) => (
                                            <button key={idx} onClick={() => setActiveCardIndex(idx)} className={`w-2 h-2 rounded-full transition-all duration-300 ${activeCardIndex === idx ? 'bg-rose-500 w-6' : 'bg-white/20 hover:bg-white/40'}`} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce text-rose-500/50"><ChevronDown /></div>
                    </section>

                    {/* Experience */}
                    <section id="experience" className="py-20 px-6 bg-white/5">
                        <div className="container mx-auto max-w-5xl">
                            <div className="mb-12 text-center">
                                <h2 className="text-3xl md:text-4xl font-bold text-white mb-4 relative inline-block">Experience<div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-16 h-1 bg-gradient-to-r from-pink-500 to-violet-500 rounded-full"></div></h2>
                                <p className="text-rose-200/70 mt-4 max-w-2xl mx-auto">My professional journey in Data Science and AI Engineering.</p>
                            </div>
                            <div className="space-y-12 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-rose-500/50 before:to-transparent">
                                {EXPERIENCE.map((exp) => (
                                    <div key={exp.id} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group">
                                        <div className="flex items-center justify-center w-10 h-10 rounded-full border-2 border-rose-400 bg-[#0f0510] shadow-[0_0_15px_rgba(244,63,94,0.3)] shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10"><Briefcase className="w-5 h-5 text-rose-400" /></div>
                                        <div className="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-[#150816] p-6 rounded-2xl border border-white/5 shadow-lg hover:border-rose-500/30 hover:shadow-[0_0_20px_rgba(244,63,94,0.1)] transition-all duration-300">
                                            <div className="flex flex-col sm:flex-row justify-between mb-2">
                                                <h3 className="font-bold text-lg text-white">{exp.role}</h3>
                                                <span className="text-xs font-mono text-rose-300 bg-rose-500/10 px-2 py-1 rounded-full self-start sm:self-center border border-rose-500/20">{exp.period}</span>
                                            </div>
                                            <div className="text-sm text-violet-300 mb-4 font-medium">{exp.company} | {exp.location}</div>
                                            <p className="text-gray-400 text-sm mb-4 italic">"{exp.description}"</p>
                                            <ul className="space-y-2">
                                                {exp.achievements.map((item, i) => <li key={i} className="flex items-start gap-2 text-sm text-gray-300"><span className="mt-1.5 w-1.5 h-1.5 bg-rose-500 rounded-full shrink-0"></span><span>{item}</span></li>)}
                                            </ul>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Projects, Skills, Contact */}
                    <section className="py-12 px-6">
                         <div className="container mx-auto max-w-5xl">
                             <div className="grid md:grid-cols-2 gap-6">
                                 {EDUCATION.map((edu, idx) => (
                                     <div key={idx} className="bg-white/5 p-6 rounded-2xl border border-white/5 hover:border-rose-500/20 transition-colors flex gap-4 items-start">
                                         <div className="p-3 bg-rose-500/10 rounded-xl text-rose-400"><GraduationCap className="w-6 h-6" /></div>
                                         <div>
                                             <h3 className="text-white font-bold text-lg">{edu.school}</h3>
                                             <p className="text-rose-300 text-sm font-medium">{edu.degree}</p>
                                             <p className="text-gray-400 text-xs mt-1 mb-2">{edu.location}</p>
                                             <p className="text-gray-300 text-sm leading-relaxed">{edu.details}</p>
                                         </div>
                                     </div>
                                 ))}
                             </div>
                         </div>
                    </section>

                    <section id="projects" className="py-20 px-6 bg-white/5">
                        <div className="container mx-auto max-w-6xl">
                             <div className="mb-12 text-center"><h2 className="text-3xl md:text-4xl font-bold text-white mb-4 relative inline-block">Featured Projects<div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-16 h-1 bg-gradient-to-r from-pink-500 to-violet-500 rounded-full"></div></h2><p className="text-rose-200/70 mt-4 max-w-2xl mx-auto">Recent work in predictive modeling and algorithmic auditing.</p></div>
                             <div className="grid md:grid-cols-2 gap-8">
                                 {PROJECTS.map((project, idx) => (
                                     <div key={idx} className="group bg-[#150816] rounded-3xl border border-white/5 overflow-hidden hover:shadow-2xl hover:shadow-rose-500/10 hover:border-rose-500/30 transition-all duration-300">
                                         <div className="p-8">
                                             <div className="flex justify-between items-start mb-6">
                                                 <div className="p-3 bg-violet-500/10 rounded-xl text-violet-300 group-hover:bg-gradient-to-r group-hover:from-rose-500 group-hover:to-violet-500 group-hover:text-white transition-all duration-300">{project.icon}</div>
                                                 <div className="text-xs font-mono text-gray-500 bg-white/5 px-3 py-1 rounded-full border border-white/5">{project.period}</div>
                                             </div>
                                             <h3 className="text-2xl font-bold text-white mb-2 group-hover:text-rose-300 transition-colors">{project.title}</h3>
                                             <p className="text-sm text-violet-300 mb-4 font-medium">{project.type}</p>
                                             <p className="text-gray-400 mb-6">{project.description}</p>
                                             <div className="space-y-3 mb-6">
                                                 {project.points.map((point, i) => <div key={i} className="flex gap-3 text-sm text-gray-300"><CodeIcon className="w-4 h-4 text-rose-400/50 mt-1 shrink-0" /><span>{point}</span></div>)}
                                             </div>
                                             <div className="flex flex-wrap gap-2 pt-4 border-t border-white/5">
                                                 {project.tech.map((tech, i) => <span key={i} className="text-xs font-medium text-rose-100/70 bg-rose-500/5 px-2 py-1 rounded border border-rose-500/10">{tech}</span>)}
                                             </div>
                                         </div>
                                     </div>
                                 ))}
                             </div>
                        </div>
                    </section>

                    <section id="skills" className="py-20 px-6">
                         <div className="container mx-auto max-w-5xl">
                            <div className="mb-12 text-center"><h2 className="text-3xl md:text-4xl font-bold text-white mb-4 relative inline-block">Technical Skills<div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-16 h-1 bg-gradient-to-r from-pink-500 to-violet-500 rounded-full"></div></h2><p className="text-rose-200/70 mt-4 max-w-2xl mx-auto">Technical stack and tools I use to build intelligent systems.</p></div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {Object.entries(SKILLS).map(([category, skills], idx) => (
                                    <div key={idx} className="bg-white/5 p-6 rounded-2xl border border-white/5 hover:border-rose-500/30 transition-colors hover:-translate-y-1 duration-300">
                                        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                            {idx === 0 && <Brain className="w-5 h-5 text-rose-400" />}
                                            {idx === 1 && <Database className="w-5 h-5 text-violet-400" />}
                                            {idx === 2 && <Terminal className="w-5 h-5 text-pink-400" />}
                                            {idx === 3 && <Layout className="w-5 h-5 text-fuchsia-400" />}
                                            {category}
                                        </h3>
                                        <div className="flex flex-wrap gap-2">
                                            {skills.map((skill, sIdx) => <span key={sIdx} className="px-3 py-1 bg-rose-500/10 text-rose-200 rounded-full text-sm font-medium border border-rose-500/20 hover:border-rose-400 hover:bg-rose-500/20 transition-all duration-300 cursor-default shadow-[0_0_10px_rgba(244,63,94,0.1)]">{skill}</span>)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                         </div>
                    </section>

                    <section id="contact" className="py-20 px-6 relative overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-b from-[#0f0510] to-violet-950/30"></div>
                        <div className="container mx-auto max-w-4xl text-center relative z-10">
                             <div className="mb-12 text-center"><h2 className="text-3xl md:text-4xl font-bold text-white mb-4 relative inline-block">Let's Connect<div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-16 h-1 bg-gradient-to-r from-pink-500 to-violet-500 rounded-full"></div></h2></div>
                             <p className="text-xl text-gray-300 mb-12 max-w-2xl mx-auto">I am always interested in connecting with fellow engineers, researchers, and tech enthusiasts. Whether you want to discuss the latest in LLMs or just say hi, feel free to reach out!</p>
                             <div className="flex flex-col md:flex-row justify-center gap-6 mb-12">
                                 <a href={`mailto:${PERSONAL_INFO.email}`} className="group flex items-center justify-center gap-4 bg-white/5 p-6 rounded-2xl border border-white/10 hover:border-rose-500 hover:bg-rose-500/10 transition-all w-full md:w-auto hover:-translate-y-1">
                                     <div className="p-3 bg-rose-500/20 rounded-full group-hover:bg-rose-500 group-hover:text-white transition-colors text-rose-400"><Mail className="w-6 h-6" /></div>
                                     <div className="text-left"><p className="text-sm text-gray-400 group-hover:text-rose-200">Email</p><p className="text-white font-medium">{PERSONAL_INFO.email}</p></div>
                                 </a>
                                 <a href={PERSONAL_INFO.linkedin} target="_blank" rel="noreferrer" className="group flex items-center justify-center gap-4 bg-white/5 p-6 rounded-2xl border border-white/10 hover:border-rose-500 hover:bg-rose-500/10 transition-all w-full md:w-auto hover:-translate-y-1">
                                     <div className="p-3 bg-rose-500/20 rounded-full group-hover:bg-rose-500 group-hover:text-white transition-colors text-rose-400"><Linkedin className="w-6 h-6" /></div>
                                     <div className="text-left"><p className="text-sm text-gray-400 group-hover:text-rose-200">LinkedIn</p><p className="text-white font-medium">Connect with Yanjing</p></div>
                                 </a>
                             </div>
                            <footer className="text-gray-500 text-sm pt-8 border-t border-white/10">
                                <p className="mt-2">Built with React & Tailwind CSS</p>
                            </footer>
                        </div>
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Portfolio />);
    </script>
</body>
</html>
